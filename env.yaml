name: nninfo

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.10
  - pytorch=1.13
  - torchvision=0.14
  - numpy=1.23
  - scipy=1.9
  - pandas=1.5
  - filelock=3.7
  - matplotlib=3.6
  - pytables=3.7
  - ipykernel
  - ipywidgets
  - pyyaml=6.0
  - prettytable
  
  - pip
  - pip:
    - setuptools<81  # sxpid needs pkg_resources, removed in setuptools 81
    - matplotlib-inline<0.2  # 0.2.x requires matplotlib >=3.9 (rcParams._get)
    - git+https://github.com/Abzinger/SxPID.git@targetpointwise
    - git+https://github.com/Abzinger/BROJA_2PID.git